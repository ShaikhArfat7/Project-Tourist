name: tourist_safety_app
description: "A tourist safety management app with live tracking, SOS alerts, and nearby emergency services."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  url_launcher: ^6.3.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2
  geolocator: ^13.0.2
  geocoding: ^5.0.0
  shared_preferences: ^2.3.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  file_picker: ^13.1.0
  csv: ^8.0.0
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/destinations.json
    - assets/data/danger_zones.json
    - assets/data/crime_state_ncrb.json
    - assets/data/crime_maharashtra_districts.json
    - assets/data/crime_metadata.json