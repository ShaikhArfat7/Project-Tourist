  <!-- Google Maps JavaScript API for Flutter Web development -->
  <script>
    // Paste your Google Maps Web API key below to enable embedded maps in Chrome.
    // When left empty, the app gracefully displays the Live GPS Web Preview card.
    window.GOOGLE_MAPS_API_KEY = "";
    window.gm_authFailure = function() {
      window._googleMapsAuthFailed = true;
    };
    window.isGoogleMapsLoaded = function() {
      return Boolean(
        window.GOOGLE_MAPS_API_KEY &&
        !window._googleMapsAuthFailed &&
        typeof google !== 'undefined' &&
        typeof google.maps !== 'undefined'
      );
    };
    if (window.GOOGLE_MAPS_API_KEY) {
      var script = document.createElement('script');
      script.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(window.GOOGLE_MAPS_API_KEY);
      script.async = true;
      document.head.appendChild(script);
    }
  </script>
